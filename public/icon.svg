<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.8" filter="url(#neonGlow)" />

  <!-- Radiating Energy Segments -->
  <g stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="60" x2="256" y2="90" />
    <line x1="256" y1="422" x2="256" y2="452" />
    <line x1="60" y1="256" x2="90" y2="256" />
    <line x1="422" y1="256" x2="452" y2="256" />
    <line x1="118" y1="118" x2="140" y2="140" />
    <line x1="394" y1="394" x2="372" y2="372" />
    <line x1="118" y1="394" x2="140" y2="372" />
    <line x1="394" y1="118" x2="372" y2="140" />
  </g>

  <!-- Inner Cyan Ring -->
  <circle cx="256" cy="256" r="110" fill="#041226" stroke="#00f0ff" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Central Arc Core Glow -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Crown Emblem for Basit -->
  <path d="M 226 210 L 236 226 L 256 198 L 276 226 L 286 210 L 286 238 L 226 238 Z" fill="#38bdf8" opacity="0.9" />
</svg>
